name: mac

# Builds the macOS menu-bar app (mac/). Every push to main that touches the port
# produces a downloadable artifact; a v* release tag also attaches the zip to that
# release, next to the Windows Claudometer.exe (the Windows updater only looks for
# the .exe asset, so the two coexist).
on:
  push:
    branches: [main]
    paths: ['mac/**', '.github/workflows/mac.yml']
    tags: ['v*']
  pull_request:
    paths: ['mac/**', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version && xcodebuild -version || true

      - name: Build (release, universal)
        working-directory: mac
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Assemble Claudometer.app
        working-directory: mac
        run: |
          set -e
          APP="Claudometer.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/Claudometer"
          cp "$BIN" "$APP/Contents/MacOS/Claudometer"
          cp Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/Claudometer"
          # ad-hoc sign so Gatekeeper lets it launch after the quarantine bit is cleared
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "signed (ad-hoc)"
          lipo -info "$APP/Contents/MacOS/Claudometer"
          ditto -c -k --keepParent "$APP" Claudometer-mac.zip
          ls -la Claudometer-mac.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Claudometer-mac
          path: mac/Claudometer-mac.zip
          if-no-files-found: error

      - name: Attach to release (on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mac/Claudometer-mac.zip
